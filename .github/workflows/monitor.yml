name: Monitor Gdansk public data
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: gdansk-radar-scan
  cancel-in-progress: true
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spreadsheet readers
        run: python -m pip install openpyxl xlrd
      - name: Validate application build
        run: |
          npm install --no-package-lock
          npm run build
          python -m py_compile scripts/collect.py
          python scripts/test_collect.py
      - name: Diagnose BIP list-loading scripts
        run: python scripts/diagnose_bip.py
      - name: Collect latest source data
        run: python scripts/collect.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- public/data/latest.json public/data/parcel_cache.json; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/latest.json public/data/parcel_cache.json
            git commit -m "Update city monitoring data"
            git push
          fi
