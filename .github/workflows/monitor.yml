name: Monitor Gdansk public data
on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect latest source data
        run: python scripts/collect.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- public/data/latest.json; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/latest.json
            git commit -m "Update city monitoring data"
            git push
          fi
